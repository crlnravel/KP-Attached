appId: com.electron.app
productName: web
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
extraResources:
  - from: resources/model-launchers
    to: model-launchers
  - from: ../attached-inference-runtime
    to: attached-inference-runtime
    filter:
      - 'attachment_classifier/attachment_binary.py'
      - 'attachment_classifier/attachment_datamodule_binary.py'
      - 'attachment_classifier/attachment_dataset.py'
      - 'attachment_classifier/main_binary.py'
      - 'lightning_logs/rerunacc6522b22_evaq/version_0/checkpoints/epoch=12-step=26.ckpt'
      - 'run_model/requirements.txt'
      - 'run_model/mmaction_requirements.txt'
      - 'run_model/mmaction_mac_requirements.txt'
      - 'run_model/run_inference.sh'
      - 'run_model/run_integrated_pipeline.sh'
      - 'run_model/run_raw_pipeline.sh'
      - 'run_model/run_raw_pipeline_mac.sh'
      - 'run_model/scripts/aggregate_trial_predictions.py'
      - 'run_model/scripts/build_fused_dataset.py'
      - 'run_model/scripts/convert_audio_to_mel.py'
      - 'run_model/scripts/discover_attachment_ckpt.py'
      - 'run_model/scripts/run_mmaction_inference.py'
      - 'run_model/scripts/run_mmaction_mac_inference.py'
      - 'run_model/work_dirs_cache/65exposure_small_cl512_fi2_b8_ep30/65exposure_small_cl512_fi2.py'
      - 'run_model/work_dirs_cache/65exposure_small_cl512_fi2_b8_ep30/latest.pth'
      - 'run_model/work_dirs_cache/65_response_video_base_cl512_fi2_b8_ep30/65_response_video_base_cl512_fi2.py'
      - 'run_model/work_dirs_cache/65_response_video_base_cl512_fi2_b8_ep30/latest.pth'
      - 'run_model/work_dirs_cache/inc_response_audio_cl32_fi2_ep100/inc_response_audio_cl32_fi2.py'
      - 'run_model/work_dirs_cache/inc_response_audio_cl32_fi2_ep100/latest.pth'
win:
  executableName: web
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
